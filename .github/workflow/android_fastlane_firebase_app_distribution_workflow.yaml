name: Andriod FastLane With Firebase App Distribution Workflow

on:
  push:
    branches:
      - master

jobs:
  distribute_to_firebase_app_distribution: 
    runs-on: ubuntu-latest   # ubuntu for android (macos for ios)
    steps:
    - name: Checkout my repo code
      uses: actions/checkout@v2

    - name: Setup up JDK 11   # setup java version for android
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Ruby for FastLane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
        working-directory: android

    - name: Build And Distribute App
      env:
        FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
      run:
        bundle exec fastlane android firebase_distribution
      working-directory: android
    