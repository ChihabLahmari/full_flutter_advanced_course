# Added a comment to trigger GitHub Actions
name: Andriod FastLane With Firebase App Distribution Workflow

on:
  push:
    branches:
      - master

jobs:
  distribute_to_firebase_app_distribution:
    runs-on: ubuntu-latest # ubuntu for android (macos for ios)
    steps:
      - name: Checkout my repo code
        uses: actions/checkout@v2

      - name: Setup up JDK 17 # setup java version for android
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Verify Flutter & Java Setup
        run: 
          flutter doctor -v
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

      - name: Setup Ruby for FastLane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
          working-directory: android

      - name: Build And Distribute App
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        run: bundle exec fastlane android firebase_distribution
        working-directory: android
